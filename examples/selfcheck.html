<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firstlight · Self-check</title>
<link rel="icon" href="../icon.svg" />
<style>
  :root { --bg: #f6f2ea; --ink: #1f1c18; --muted: #5d564d; --ok: #2f6b45; --bad: #a3402a; --line: #e2dbcf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #181614; --ink: #f1ece4; --muted: #b5aca0; --ok: #7cc495; --bad: #f08f75; --line: #2f2b27; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
  h1 { font: 600 30px/1.2 Newsreader, Georgia, serif; margin: 0 0 6px; }
  p.lede { color: var(--muted); margin: 0 0 28px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; font-size: 14px; color: var(--muted); }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; }
  #stage { width: 1px; height: 1px; overflow: hidden; }
</style>
<body>
<main>
  <h1>Self-check</h1>
  <p class="lede">Runs the v1 done criteria that need a GPU. Each row says what was compared, the number, and the threshold.</p>
  <table><thead><tr><th>Check</th><th>Result</th><th>Pass</th></tr></thead><tbody id="rows"></tbody></table>
  <div id="stage"></div>
</main>
<script type="module" src="./selfcheck.ts"></script>
</body>
</html>
